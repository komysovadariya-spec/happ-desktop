<title>Анкета клиента</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500&display=swap">
<style>
  :root {
    --bg: #F7F5F1;
    --surface: #FFFFFF;
    --border: #DAD7D1;
    --text: #292929;
    --muted: #77746F;
    --accent: #4F625B;
    --accent-hover: #3C4D47;
    --accent-light: #E9EEEB;
    --danger: #9B3A3A;
    --section-bg: #F2F0EC;
    --shadow: 0 2px 12px rgba(79,98,91,0.07);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 32px 16px;
  }

  .container { max-width: 580px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 32px; }

  .header .logo {
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .header h1 { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 700; color: var(--text); }
  .header p { color: var(--muted); font-size: 14px; margin-top: 6px; }

  .card {
    background: var(--surface);
    border-radius: 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 16px;
  }

  .section-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .field-row.triple { grid-template-columns: 1fr 1fr 1fr; }

  @media (max-width: 480px) {
    .field-row, .field-row.triple { grid-template-columns: 1fr; }
  }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }

  label { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; }
  label .req { color: var(--danger); margin-left: 2px; }

  input[type="text"], input[type="tel"] {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 13px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }

  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  input::placeholder { color: var(--muted); opacity: 0.6; }
  input.invalid { border-color: var(--danger); }

  .child-block { background: var(--section-bg); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .child-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .child-num { font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; color: var(--accent); }
  .remove-child { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 18px; padding: 0 4px; }
  .remove-child:hover { color: var(--danger); }

  .btn-add {
    width: 100%;
    background: var(--accent-light);
    color: var(--accent);
    border: 1.5px dashed var(--accent);
    border-radius: 10px;
    padding: 10px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-submit {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.15s;
  }

  .btn-submit:hover { background: var(--accent-hover); }
  .btn-submit:disabled { opacity: 0.7; cursor: default; }

  .note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .error-msg { color: var(--danger); font-size: 12px; margin-top: 3px; display: none; }

  .success-box {
    display: none;
    background: #EAF4ED;
    border: 1.5px solid #A8C8B0;
    border-radius: 16px;
    padding: 48px 24px;
    text-align: center;
  }

  .success-box .icon { font-size: 52px; margin-bottom: 16px; }

  .success-box h2 {
    font-family: 'Montserrat', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #2D6A4F;
    margin-bottom: 8px;
  }

  .success-box p { color: #52796F; font-size: 14px; }
</style>

<div class="container">
  <div class="header">
    <div class="logo">АН ЦАН • Новостройки Владивостока</div>
    <h1>Анкета клиента</h1>
    <p>Риелтор <strong>Новикова Дарья</strong> — заполните данные</p>
  </div>

  <div class="success-box" id="successBox">
    <div class="icon">✅</div>
    <h2>Данные отправлены успешно!</h2>
    <p>Риелтор свяжется с вами в ближайшее время</p>
  </div>

  <form id="clientForm" novalidate>

    <div class="card">
      <div class="section-title">Клиент</div>
      <div class="field-row triple">
        <div class="field">
          <label>Фамилия <span class="req">*</span></label>
          <input type="text" id="cl_last" placeholder="Иванова">
        </div>
        <div class="field">
          <label>Имя <span class="req">*</span></label>
          <input type="text" id="cl_first" placeholder="Мария">
        </div>
        <div class="field">
          <label>Отчество</label>
          <input type="text" id="cl_mid" placeholder="Петровна">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Дата рождения</label>
          <input type="text" id="cl_dob" placeholder="ДД.ММ.ГГГГ">
        </div>
        <div class="field">
          <label>Телефон <span class="req">*</span></label>
          <input type="tel" id="cl_phone" placeholder="+7 900 000 00 00">
          <span class="error-msg" id="cl_phone_err">Введите номер телефона</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Супруг / Супруга</div>
      <div class="field-row triple">
        <div class="field"><label>Фамилия</label><input type="text" id="sp_last" placeholder="Иванов"></div>
        <div class="field"><label>Имя</label><input type="text" id="sp_first" placeholder="Алексей"></div>
        <div class="field"><label>Отчество</label><input type="text" id="sp_mid" placeholder="Николаевич"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Дата рождения</label><input type="text" id="sp_dob" placeholder="ДД.ММ.ГГГГ"></div>
        <div class="field"><label>Телефон</label><input type="tel" id="sp_phone" placeholder="+7 900 000 00 00"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Дети</div>
      <div id="children-list"></div>
      <button type="button" class="btn-add" id="add-child"><span>＋</span> Добавить ребёнка</button>
    </div>

    <button type="submit" class="btn-submit">Отправить →</button>
    <p class="note">Данные придут риелтору на email</p>
  </form>
</div>

<script>
  let childCount = 0;

  function g(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }

  function addChild() {
    childCount++;
    var n = childCount;
    var div = document.createElement('div');
    div.className = 'child-block';
    div.id = 'child_' + n;
    div.innerHTML =
      '<div class="child-header"><span class="child-num">Ребёнок ' + n + '</span>' +
      '<button type="button" class="remove-child" onclick="removeChild(' + n + ')">×</button></div>' +
      '<div class="field-row triple">' +
        '<div class="field"><label>Фамилия</label><input type="text" id="ch' + n + '_last" placeholder="Иванова"></div>' +
        '<div class="field"><label>Имя</label><input type="text" id="ch' + n + '_first" placeholder="Анна"></div>' +
        '<div class="field"><label>Отчество</label><input type="text" id="ch' + n + '_mid" placeholder="Алексеевна"></div>' +
      '</div>' +
      '<div class="field-row">' +
        '<div class="field"><label>Дата рождения</label><input type="text" id="ch' + n + '_dob" placeholder="ДД.ММ.ГГГГ"></div>' +
        '<div class="field"><label>Телефон (если 14+)</label><input type="tel" id="ch' + n + '_phone" placeholder="+7 900 000 00 00"></div>' +
      '</div>';
    document.getElementById('children-list').appendChild(div);
  }

  function removeChild(n) {
    var el = document.getElementById('child_' + n);
    if (el) el.remove();
  }

  document.getElementById('add-child').addEventListener('click', addChild);

  document.getElementById('clientForm').addEventListener('submit', function(e) {
    e.preventDefault();

    var ok = true;
    ['cl_last', 'cl_first', 'cl_phone'].forEach(function(id) {
      var el = document.getElementById(id);
      if (!el.value.trim()) { el.classList.add('invalid'); ok = false; }
      else el.classList.remove('invalid');
    });
    var phoneErr = document.getElementById('cl_phone_err');
    if (!g('cl_phone')) { phoneErr.style.display = 'block'; ok = false; }
    else phoneErr.style.display = 'none';
    if (!ok) return;

    var btn = document.querySelector('.btn-submit');
    btn.textContent = 'Отправляем...';
    btn.disabled = true;

    // Формируем читаемое письмо
    var lines = [];

    // Клиент
    var clFio = [g('cl_last'), g('cl_first'), g('cl_mid')].filter(Boolean).join(' ');
    lines.push('КЛИЕНТ');
    lines.push('ФИО: ' + clFio);
    if (g('cl_dob')) lines.push('Дата рождения: ' + g('cl_dob'));
    lines.push('Телефон: ' + g('cl_phone'));

    // Супруг
    var spFio = [g('sp_last'), g('sp_first'), g('sp_mid')].filter(Boolean).join(' ');
    if (spFio) {
      lines.push('');
      lines.push('СУПРУГ / СУПРУГА');
      lines.push('ФИО: ' + spFio);
      if (g('sp_dob')) lines.push('Дата рождения: ' + g('sp_dob'));
      if (g('sp_phone')) lines.push('Телефон: ' + g('sp_phone'));
    }

    // Дети
    var children = document.querySelectorAll('.child-block');
    if (children.length > 0) {
      lines.push('');
      lines.push('ДЕТИ');
      children.forEach(function(block, i) {
        var bid = block.id.replace('child_', '');
        var chFio = [g('ch'+bid+'_last'), g('ch'+bid+'_first'), g('ch'+bid+'_mid')].filter(Boolean).join(' ');
        var line = (i+1) + '. ' + (chFio || '—');
        if (g('ch'+bid+'_dob')) line += ', д.р. ' + g('ch'+bid+'_dob');
        lines.push(line);
        if (g('ch'+bid+'_phone')) lines.push('   Телефон: ' + g('ch'+bid+'_phone'));
      });
    }

    var message = lines.join('\n');

    fetch('https://formsubmit.co/ajax/komysovadariya@gmail.com', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        '_subject': 'Анкета клиента: ' + clFio,
        '_captcha': 'false',
        'Анкета': message
      })
    })
    .then(function(r) { return r.json(); })
    .then(function() {
      document.getElementById('clientForm').style.display = 'none';
      document.getElementById('successBox').style.display = 'block';
      window.scrollTo(0, 0);
    })
    .catch(function() {
      btn.textContent = 'Отправить →';
      btn.disabled = false;
      alert('Ошибка отправки. Попробуйте ещё раз.');
    });
  });
</script>
